<svg xmlns="http://www.w3.org/2000/svg" width="390" height="86" viewBox="0 0 390 86" role="img" aria-labelledby="title desc">
  <title id="title">uartbinlib logo</title>
  <desc id="desc">UART dalga izini temsil eden uartbinlib logosu.</desc>
  <defs>
    <linearGradient id="trace" x1="16" y1="0" x2="132" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".54" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="word" x1="147" y1="0" x2="368" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4db3ff"/>
      <stop offset=".55" stop-color="#2f8ff2"/>
      <stop offset="1" stop-color="#8bdcff"/>
    </linearGradient>
    <filter id="traceGlow" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wordGlow" x="-6%" y="-24%" width="112%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#2d9cff" flood-opacity=".32"/>
    </filter>
  </defs>

  <g transform="translate(16 16)">
    <rect x="0" y="0" width="120" height="54" rx="14" fill="#0b1220" opacity=".92" stroke="#164e63" stroke-width="1.4"/>
    <path d="M10 36 H20 V18 H31 V36 H43 V18 H59 V36 H70 V18 H87 V36 H110"
          fill="none"
          stroke="url(#trace)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#traceGlow)"/>
    <g stroke="#164e63" stroke-width="1" opacity=".42">
      <path d="M12 10 H108"/>
      <path d="M12 45 H108"/>
      <path d="M25 8 V47"/>
      <path d="M49 8 V47"/>
      <path d="M73 8 V47"/>
      <path d="M97 8 V47"/>
    </g>
  </g>

  <text x="150" y="55"
        fill="url(#word)"
        filter="url(#wordGlow)"
        font-family="Segoe UI, Inter, Avenir Next, Arial, sans-serif"
        font-size="44"
        font-weight="520"
        letter-spacing=".4">uartbinlib</text>
</svg>
